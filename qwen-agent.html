<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0c10;
    --panel: #101218;
    --panel-2: #161922;
    --panel-3: #1c2029;
    --border: #232733;
    --border-2: #2c3140;
    --text: #e6e8ef;
    --muted: #8b90a5;
    --muted-2: #626778;
    --accent: #7c6cff;
    --accent-2: #4f8fff;
    --success: #3ecf8e;
    --danger: #ff5c72;
    --grad: linear-gradient(135deg, #7c6cff, #4f8fff);
    --shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 12% -10%, rgba(124,108,255,0.10), transparent 45%),
      radial-gradient(circle at 90% 110%, rgba(79,143,255,0.08), transparent 45%);
    background-attachment: fixed;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262a36; border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #333849; }

  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    height: 100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 14px 14px;
    gap: 14px;
    min-height: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 6px;
  }
  .logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--grad);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: #fff;
    box-shadow: 0 6px 20px rgba(124,108,255,0.35);
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .brand-name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted-2); margin-top: -3px; letter-spacing: 0.05em; text-transform: uppercase; }

  .btn {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
    text-align: left;
  }
  .btn:hover { background: var(--panel-3); border-color: var(--border-2); }
  .btn-primary {
    background: var(--grad);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 6px 18px rgba(124,108,255,0.28);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--panel-2); color: var(--text); }

  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .section { display: flex; flex-direction: column; gap: 7px; min-height: 0; }
  .section.grow { flex: 1; }
  .section-title {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted-2); padding: 0 6px;
  }

  .conv-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
  .conv-item {
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: all 0.12s;
    display: flex; align-items: center; gap: 8px;
    position: relative;
  }
  .conv-item:hover { background: var(--panel-2); color: var(--text); }
  .conv-item.active { background: var(--panel-3); color: var(--text); font-weight: 500; }
  .conv-item.active::before {
    content: ''; position: absolute; left: 0; top: 20%; height: 60%; width: 2px;
    background: var(--grad); border-radius: 2px;
  }
  .conv-item .del {
    margin-left: auto; opacity: 0; transition: opacity 0.15s;
    font-size: 15px; line-height: 1; color: var(--muted-2); padding: 0 3px;
  }
  .conv-item:hover .del { opacity: 1; }
  .conv-item .del:hover { color: var(--danger); }

  /* ---------- MAIN ---------- */
  .main {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    position: relative;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(16,18,24,0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 5;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .header-right { display: flex; align-items: center; gap: 6px; }

  .model-select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    max-width: 260px;
    transition: border-color 0.15s;
  }
  .model-select:hover, .model-select:focus { border-color: var(--accent); }

  .status {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    padding: 5px 10px;
    border-radius: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted-2);
    flex-shrink: 0;
  }
  .status.online .dot { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2.4s infinite; }
  .status.offline .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .status.online { color: var(--success); }
  .status.offline { color: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .icon-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 9px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- CHAT ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0 12px;
    scroll-behavior: smooth;
    min-height: 0;
  }

  .chat-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex; flex-direction: column; gap: 22px;
  }

  .empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px; pointer-events: none;
    z-index: 1;
  }
  .empty.hidden { display: none; }
  .empty-logo {
    width: 68px; height: 68px; border-radius: 20px;
    background: var(--grad);
    display: grid; place-items: center;
    font-size: 24px; font-weight: 700; color: #fff;
    box-shadow: 0 16px 48px rgba(124,108,255,0.35);
    margin-bottom: 22px;
    animation: float 4s ease-in-out infinite;
    letter-spacing: 0.02em;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .empty h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .empty p { color: var(--muted); max-width: 460px; margin-bottom: 30px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 560px; pointer-events: auto; }
  .chip {
    padding: 9px 15px;
    border-radius: 20px;
    border: 1px solid var(--border-2);
    background: var(--panel-2);
    color: var(--muted);
    font-family: inherit; font-size: 12.5px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); background: rgba(124,108,255,0.08); transform: translateY(-1px); }

  .msg {
    display: flex; gap: 13px;
    animation: fadeIn 0.28s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .avatar {
    width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0; margin-top: 2px;
    letter-spacing: 0.02em;
  }
  .msg.user .avatar { background: var(--panel-3); color: var(--muted); border: 1px solid var(--border-2); }
  .msg.assistant .avatar { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(124,108,255,0.3); }

  .msg-body { flex: 1; min-width: 0; padding-top: 3px; }
  .msg-name { font-size: 11.5px; font-weight: 600; color: var(--muted-2); margin-bottom: 4px; letter-spacing: 0.02em; text-transform: uppercase; }
  .msg.user .msg-content {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    display: inline-block;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant .msg-content { padding: 0; }

  /* Markdown */
  .md { word-wrap: break-word; overflow-wrap: break-word; }
  .md p { margin: 0 0 12px; }
  .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 18px 0 10px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--accent-2); text-decoration: none; border-bottom: 1px solid rgba(79,143,255,0.3); }
  .md a:hover { border-bottom-color: var(--accent-2); }
  .md blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 14px;
    margin: 12px 0;
    color: var(--muted);
    background: rgba(124,108,255,0.04);
    border-radius: 0 8px 8px 0;
  }
  .md code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px;
    background: var(--panel-3);
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    color: #e0c9ff;
  }
  .md pre {
    position: relative;
    background: #0d1017;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0;
  }
  .md pre code {
    background: none; border: none; padding: 0;
    font-size: 12.5px; line-height: 1.65; color: inherit;
  }
  .md table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .md th { background: var(--panel-2); font-weight: 600; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--panel-3);
    border: 1px solid var(--border-2);
    color: var(--muted);
    font-family: inherit; font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.15s;
  }
  .md pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--success); border-color: rgba(62,207,142,0.4); }

  .spinner {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12.5px;
    padding: 4px 0;
  }
  .spinner .dots { display: inline-flex; gap: 3px; }
  .spinner .dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.4s infinite;
  }
  .spinner .dots i:nth-child(2) { animation-delay: 0.15s; }
  .spinner .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }

  /* ---------- COMPOSER ---------- */
  .composer { padding: 12px 24px 20px; }
  .composer-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
    transition: all 0.2s;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .composer-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,108,255,0.12), 0 8px 30px rgba(0,0,0,0.3);
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit; font-size: 14px; line-height: 1.55;
    resize: none;
    max-height: 200px;
    padding: 6px 0;
  }
  #input::placeholder { color: var(--muted-2); }

  .send-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: 10px;
    background: var(--grad);
    border: none;
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(124,108,255,0.3);
  }
  .send-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .send-btn svg { width: 16px; height: 16px; }
  .send-btn.stop { background: linear-gradient(135deg, #ff5c72, #ff8a5c); }

  .composer-hint {
    max-width: 820px; margin: 8px auto 0;
    font-size: 11px; color: var(--muted-2);
    text-align: center;
  }

  /* ---------- MODAL ---------- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-bg.open { display: flex; animation: fadeIn 0.2s ease; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 18px;
    width: 100%; max-width: 560px;
    max-height: 86vh; overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal-head {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .field input, .field textarea {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit; font-size: 13px;
    outline: none; resize: vertical;
    transition: border-color 0.15s;
  }
  .field textarea { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.55; min-height: 140px; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .modal-foot {
    padding: 16px 24px 20px;
    display: flex; gap: 10px; justify-content: flex-end;
    border-top: 1px solid var(--border);
  }
  .modal-foot .btn { width: auto; padding: 9px 18px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <div class="brand-name">AI Chat</div>
        <div class="brand-sub">Local</div>
      </div>
    </div>

    <button class="btn btn-primary" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <div class="section grow">
      <div class="section-title">Conversations</div>
      <div class="conv-list" id="convList"></div>
    </div>

    <button class="btn btn-ghost" id="settingsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="header">
      <div class="header-left">
        <select class="model-select" id="modelSelect">
          <option>Loading...</option>
        </select>
        <div class="status" id="status">
          <span class="dot"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
      <div class="empty" id="empty">
        <div class="empty-logo">AI</div>
        <h1>How can I help you?</h1>
        <p>Your local AI assistant, running entirely on your machine. Ask anything — coding, writing, ideas, explanations.</p>
        <div class="chips">
          <button class="chip">Explain how recursion works with an example</button>
          <button class="chip">Write a Python function to reverse a string</button>
          <button class="chip">Give me 5 creative startup ideas</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Message the assistant…"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for newline</div>
    </div>
  </main>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <h2>Settings</h2>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Server URL</label>
        <input id="setUrl" type="text" />
      </div>
      <div class="field">
        <label>Model</label>
        <input id="setModel" type="text" />
      </div>
      <div class="field">
        <label>Temperature (0 = focused, 1 = creative)</label>
        <input id="setTemp" type="number" min="0" max="2" step="0.1" />
      </div>
      <div class="field">
        <label>System prompt</label>
        <textarea id="setSystem"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="resetSettings">Reset</button>
      <button class="btn btn-primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script>
/* ============================================================
   AI CHAT — simple local chat UI
   ============================================================ */

const DEFAULT_SYSTEM = `You are a helpful, friendly AI assistant. Give clear, concise answers. Use markdown and code blocks when helpful.`;
const DEFAULT_URL = 'http://localhost:11434';
const DEFAULT_MODEL = 'llama3.2';

const LS_KEY = 'ai-chat-state-v1';
const LS_SETTINGS = 'ai-chat-settings-v1';

/* ---------- STATE ---------- */
let settings = loadSettings();
let conversations = [];
let currentConvId = null;
let isStreaming = false;
let abortController = null;

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const chatEl = $('chat');
const chatInner = $('chatInner');
const emptyEl = $('empty');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const modelSelect = $('modelSelect');
const statusEl = $('status');
const statusText = $('statusText');
const convListEl = $('convList');

marked.setOptions({ breaks: true, gfm: true });

/* ============================================================
   SETTINGS
   ============================================================ */
function loadSettings() {
  try {
    const raw = localStorage.getItem(LS_SETTINGS);
    if (raw) return { ...defaultSettings(), ...JSON.parse(raw) };
  } catch {}
  return defaultSettings();
}
function defaultSettings() {
  return {
    url: DEFAULT_URL,
    model: DEFAULT_MODEL,
    temperature: 0.7,
    system: DEFAULT_SYSTEM,
  };
}
function saveSettings() {
  localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
}

/* ============================================================
   BACKEND (Ollama)
   ============================================================ */
async function checkBackend() {
  try {
    const r = await fetch(`${settings.url}/api/tags`, { cache: 'no-store' });
    if (!r.ok) throw new Error('bad status');
    const data = await r.json();
    statusEl.className = 'status online';
    statusText.textContent = 'Connected';
    populateModels(data.models || []);
  } catch (e) {
    statusEl.className = 'status offline';
    statusText.textContent = 'Server offline';
  }
}

function populateModels(models) {
  const names = models.map(m => m.name);
  modelSelect.innerHTML = '';
  if (!names.length) {
    const o = document.createElement('option');
    o.textContent = 'No models installed';
    modelSelect.appendChild(o);
    return;
  }
  if (!names.includes(settings.model)) names.unshift(settings.model);
  names.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    if (n === settings.model) o.selected = true;
    modelSelect.appendChild(o);
  });
}

async function streamChat(messages, onChunk) {
  abortController = new AbortController();
  const res = await fetch(`${settings.url}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: abortController.signal,
    body: JSON.stringify({
      model: settings.model,
      messages,
      stream: true,
      options: { temperature: Number(settings.temperature) },
    }),
  });
  if (!res.ok) throw new Error(`Server HTTP ${res.status}`);

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t) continue;
      try {
        const j = JSON.parse(t);
        if (j.message && j.message.content) onChunk(j.message.content);
        if (j.done) return;
      } catch {}
    }
  }
}

/* ============================================================
   RENDERING
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function decorateCodeBlocks(root) {
  root.querySelectorAll('pre code').forEach((el) => {
    try { hljs.highlightElement(el); } catch {}
  });
  root.querySelectorAll('pre').forEach((pre) => {
    if (pre.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1400);
    };
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });
}

function scrollChat() {
  requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
}

function addUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `
    <div class="avatar">You</div>
    <div class="msg-body">
      <div class="msg-name">You</div>
      <div class="msg-content">${escapeHtml(text)}</div>
    </div>`;
  chatInner.appendChild(el);
  scrollChat();
}

function createAssistantMessage() {
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = `
    <div class="avatar">AI</div>
    <div class="msg-body">
      <div class="msg-name">Assistant</div>
      <div class="msg-content md"></div>
    </div>`;
  chatInner.appendChild(el);
  scrollChat();
  return el;
}

/* ============================================================
   CONVERSATIONS
   ============================================================ */
function newConversation() {
  const conv = {
    id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
    title: 'New chat',
    createdAt: Date.now(),
    messages: [],
  };
  conversations.unshift(conv);
  currentConvId = conv.id;
  saveConversations();
  renderConvList();
  clearChat();
  return conv;
}

function currentConv() {
  let c = conversations.find(c => c.id === currentConvId);
  if (!c) c = newConversation();
  return c;
}

function saveConversations() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      conversations: conversations.slice(0, 40),
      currentConvId,
    }));
  } catch {}
}

function loadConversations() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      conversations = data.conversations || [];
      currentConvId = data.currentConvId || null;
    }
  } catch {}
  if (!conversations.length) newConversation();
}

function renderConvList() {
  convListEl.innerHTML = '';
  conversations.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    el.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${escapeHtml(c.title)}</span>
      <span class="del" title="Delete">×</span>`;
    el.onclick = (e) => {
      if (e.target.classList.contains('del')) {
        conversations = conversations.filter(x => x.id !== c.id);
        if (currentConvId === c.id) {
          if (conversations.length) { currentConvId = conversations[0].id; }
          else { newConversation(); return; }
        }
        saveConversations();
        renderConvList();
        replayConversation();
        return;
      }
      currentConvId = c.id;
      saveConversations();
      renderConvList();
      replayConversation();
    };
    convListEl.appendChild(el);
  });
}

function clearChat() {
  chatInner.innerHTML = '';
  emptyEl.classList.remove('hidden');
}

function replayConversation() {
  clearChat();
  const c = currentConv();
  if (!c.messages.length) return;
  emptyEl.classList.add('hidden');

  c.messages.forEach((m) => {
    if (m.role === 'user') {
      addUserMessage(m.content);
    } else if (m.role === 'assistant') {
      const el = createAssistantMessage();
      const md = el.querySelector('.md');
      md.innerHTML = marked.parse(m.content);
      decorateCodeBlocks(md);
    }
  });
  scrollChat();
}

/* ============================================================
   CHAT LOOP (single request, stream, done)
   ============================================================ */
async function runChat() {
  const assistantEl = createAssistantMessage();
  const contentEl = assistantEl.querySelector('.md');
  const bodyEl = assistantEl.querySelector('.msg-body');

  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.innerHTML = 'Thinking <span class="dots"><i></i><i></i><i></i></span>';
  bodyEl.appendChild(spinner);

  let text = '';
  let firstChunk = true;
  let rafPending = false;

  const doRender = () => {
    rafPending = false;
    contentEl.innerHTML = marked.parse(text);
    decorateCodeBlocks(contentEl);
  };

  try {
    const apiMessages = [
      { role: 'system', content: settings.system },
      ...currentConv().messages,
    ];

    await streamChat(apiMessages, (chunk) => {
      if (firstChunk) { spinner.remove(); firstChunk = false; }
      text += chunk;
      if (!rafPending) { rafPending = true; requestAnimationFrame(doRender); }
    });
  } catch (e) {
    spinner.remove();
    contentEl.innerHTML = `<p style="color:var(--danger);">⚠ ${escapeHtml(e.message)}</p>`;
    isStreaming = false;
    setStreamingUI(false);
    return;
  }

  spinner.remove();
  doRender();
  currentConv().messages.push({ role: 'assistant', content: text });
  saveConversations();

  isStreaming = false;
  setStreamingUI(false);
  renderConvList();
}

/* ============================================================
   UI EVENTS
   ============================================================ */
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
}

function setStreamingUI(active) {
  sendBtn.disabled = false;
  if (active) {
    sendBtn.classList.add('stop');
    sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    sendBtn.title = 'Stop';
  } else {
    sendBtn.classList.remove('stop');
    sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    sendBtn.title = 'Send';
  }
}

async function handleSend() {
  if (isStreaming) {
    if (abortController) abortController.abort();
    isStreaming = false;
    setStreamingUI(false);
    return;
  }

  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  autoResize();
  emptyEl.classList.add('hidden');

  const conv = currentConv();
  if (conv.messages.length === 0) {
    conv.title = text.slice(0, 42) + (text.length > 42 ? '…' : '');
    renderConvList();
  }

  conv.messages.push({ role: 'user', content: text });
  addUserMessage(text);
  saveConversations();

  isStreaming = true;
  setStreamingUI(true);

  try {
    await runChat();
  } finally {
    isStreaming = false;
    setStreamingUI(false);
  }
}

/* ============================================================
   WIRING
   ============================================================ */
sendBtn.onclick = handleSend;

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
inputEl.addEventListener('input', autoResize);

$('newChatBtn').onclick = () => { newConversation(); inputEl.focus(); };

modelSelect.onchange = () => {
  settings.model = modelSelect.value;
  saveSettings();
};

// Settings modal
const modal = $('settingsModal');
function openSettings() {
  $('setUrl').value = settings.url;
  $('setModel').value = settings.model;
  $('setTemp').value = settings.temperature;
  $('setSystem').value = settings.system;
  modal.classList.add('open');
}
function closeSettings() { modal.classList.remove('open'); }

$('settingsBtn').onclick = openSettings;
$('closeSettings').onclick = closeSettings;
modal.onclick = (e) => { if (e.target === modal) closeSettings(); };

$('saveSettings').onclick = () => {
  settings.url = $('setUrl').value.trim() || DEFAULT_URL;
  settings.model = $('setModel').value.trim() || DEFAULT_MODEL;
  settings.temperature = Number($('setTemp').value);
  settings.system = $('setSystem').value || DEFAULT_SYSTEM;
  saveSettings();
  closeSettings();
  checkBackend();
};

$('resetSettings').onclick = () => {
  settings = defaultSettings();
  saveSettings();
  openSettings();
};

// Suggestion chips
document.querySelectorAll('.chip').forEach((chip) => {
  chip.onclick = () => {
    inputEl.value = chip.textContent;
    autoResize();
    handleSend();
  };
});

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  loadConversations();
  renderConvList();
  replayConversation();

  await checkBackend();
  setInterval(checkBackend, 20000);

  inputEl.focus();
})();
</script>
</body>
</html>
